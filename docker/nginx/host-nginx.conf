# ===============================
# HTTP → HTTPS
# ===============================
server {
    listen 80;
    server_name sauti.mglsd.go.ug;

    return 301 https://sauti.mglsd.go.ug$request_uri;
}

# ===============================
# HTTPS (TLS TERMINATION)
# ===============================
server {
    listen 443 ssl http2;
    server_name sauti.mglsd.go.ug;


    ssl_certificate "/etc/certificate/2025/STAR_mglsd_go_ug_bundle.crt"; #mglsd_go_ug_bundle.crt";
    ssl_certificate_key "/etc/certificate/2025/mglsd_private.key";


    ssl_session_cache shared:SSL:1m;
    ssl_session_timeout  10m;
    ssl_ciphers PROFILE=SYSTEM;
    ssl_prefer_server_ciphers on;

    access_log /var/log/nginx/sauti_access.log;
    error_log  /var/log/nginx/sauti_error.log;

    # ==================================================
    # Crawler-facing OG previews for article links (item 10). WhatsApp/
    # Facebook/X/LinkedIn/Telegram etc. read a shared link's <meta> tags
    # without running JS, so the client-rendered SPA is invisible to them.
    # For requests whose User-Agent matches a known link-preview crawler
    # ONLY, forward to the crawler-facing OG HTML (still via the docker prod
    # nginx's own /sauti/api rewrite to Django) instead of the SPA shell.
    # Everyone else keeps hitting the normal /sauti/ proxy below.
    # ==================================================
    # Internal target for the crawler rewrite below. `internal` means it
    # cannot be requested from outside, so it is not a second public URL
    # for the same article.
    location ~ ^/__og_preview/(?<og_slug>.+)$ {
        internal;
        proxy_pass http://127.0.0.1:8080/sauti/api/seo/post/$og_slug/;
        proxy_set_header Host $host;
    }

    location ~ ^/sauti/blogs/(?<og_slug>[^/]+)/?$ {
        if ($http_user_agent ~* "facebookexternalhit|Facebot|Twitterbot|WhatsApp|LinkedInBot|TelegramBot|Slackbot|Discordbot|SkypeUriPreview|Pinterest|redditbot|Applebot|Googlebot|bingbot|DuckDuckBot") {
            rewrite ^ /__og_preview/$og_slug last;
        }
        proxy_pass http://127.0.0.1:8080/sauti/blogs/$og_slug;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # ==================================================
    # PROXY /sauti/* → Docker Nginx (PATH PRESERVED)
    # ==================================================
    location /sauti/ {
        proxy_pass http://127.0.0.1:8080;
        # include proxy_params;
        proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;


        client_max_body_size 500M;

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Optional: redirect bare root to /sauti/
    location = / {
        return 301 /sauti/;
    }
}
