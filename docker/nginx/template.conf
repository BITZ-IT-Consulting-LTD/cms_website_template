# This configuration serves the application from the root within the container.
# The external reverse proxy is responsible for stripping the subdirectory prefix (e.g., /sauti/).

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        # index.html names which hashed bundle to load (e.g. index-BkRrVkKa.js).
        # Unlike /assets/ below, its filename never changes between deploys, so
        # without an explicit no-cache a browser can keep an old index.html
        # pointing at a bundle hash that no longer exists after the next
        # deploy -- the request for it then genuinely 404s, and nginx's 404
        # page is text/html, which is what a browser reports as "Failed to
        # load module script: MIME type text/html" for a JS import.
        add_header Cache-Control "no-cache";
    }

    # Health check
    location /health {
        return 200 "OK";
    }

    # Optimize static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }
}
