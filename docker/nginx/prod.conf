server {
    resolver 127.0.0.11 valid=10s;
    listen 80;
    server_name sauti.mglsd.go.ug;

    # Increase client max body size for video uploads
    client_max_body_size 500M;

    # Performance optimizations
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
    gzip_disable "msie6";

    # Connection timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Buffer sizes
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # ================= API =================
    location /sauti/api {
    # set is a rewrite-phase directive, same as rewrite -- and `break`
    # halts ALL subsequent rewrite-phase directives in this block, so with
    # set AFTER rewrite...break (the original order here), $backend_upstream
    # was NEVER assigned. proxy_pass then saw an empty variable and emitted
    # "invalid URL prefix in http://" for every single API request. set
    # must come first.
    set $backend_upstream backend:8000;
    rewrite ^/sauti/api/(.*)$ /api/$1 break;
    proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # API-specific caching for GET requests
        proxy_cache_bypass $http_upgrade;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # ================= ADMIN UI =================
    location /cms-admin/ {
        set $admin_upstream admin:80;
        # proxy_pass with a variable target disables nginx's automatic
        # location-prefix stripping (undocumented-feeling but real nginx
        # behavior), so /cms-admin/ was being forwarded to the admin
        # container VERBATIM instead of stripped -- the container's own
        # nginx has no /cms-admin/ prefix, so every asset request fell into
        # its SPA fallback and got index.html back with a text/html MIME
        # type instead of the real JS bundle. rewrite+break strips it
        # explicitly before the variable-based proxy_pass forwards it on.
        rewrite ^/cms-admin/(.*)$ /$1 break;
        proxy_pass http://$admin_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ================= Django Admin/Static =================
    # Required for the backend's own admin panel if needed
    location /sauti/django-admin/ {
        set $backend_upstream backend:8000;
        rewrite ^/sauti/django-admin/(.*)$ /admin/$1 break;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ================= Legacy Redirects =================
    location ~* ^/sauti/get-help/(.*)$ {
        return 301 /sauti/#$1;
    }

    # ================= CRAWLER-FACING OG PREVIEWS (item 10) =================
    # WhatsApp/Facebook/X/LinkedIn/Telegram etc. fetch a shared link and read
    # its <meta> tags without running JS, so the client-rendered SPA is
    # invisible to them. For requests whose User-Agent matches a known
    # link-preview crawler ONLY, serve the Django-rendered OG HTML (real
    # per-article title/description/image) at this same URL instead of the
    # SPA shell below. Everyone else keeps hitting the normal frontend.
    # Internal target for the crawler rewrite below. `internal` means it
    # cannot be requested from outside, so it is not a second public URL
    # for the same article.
    location ~ ^/__og_preview/(?<og_slug>.+)$ {
        internal;
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream/api/seo/post/$og_slug/;
        proxy_set_header Host backend;
    }

    location ~ ^/sauti/blogs/(?<og_slug>[^/]+)/?$ {
        if ($http_user_agent ~* "facebookexternalhit|Facebot|Twitterbot|WhatsApp|LinkedInBot|TelegramBot|Slackbot|Discordbot|SkypeUriPreview|Pinterest|redditbot|Applebot|Googlebot|bingbot|DuckDuckBot") {
            rewrite ^ /__og_preview/$og_slug last;
        }
        set $frontend_upstream frontend:80;
        proxy_pass http://$frontend_upstream/blogs/$og_slug;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ================= PUBLIC CMS =================
    location /sauti/ {
        set $frontend_upstream frontend:80;
        # See the /cms-admin/ block above for why this rewrite is required:
        # a variable-based proxy_pass target does not auto-strip the
        # location prefix, so without this every /sauti/assets/* request
        # was forwarded to the frontend container as literally
        # "/sauti/assets/...", which its own nginx doesn't recognize and
        # falls back to serving index.html (text/html) for.
        rewrite ^/sauti/(.*)$ /$1 break;
        proxy_pass http://$frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ================= STATIC FILES =================
    location /sauti/static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 30d;
    }

    location /sauti/media/ {
        alias /app/media/;
        access_log off;
        # Django's default storage never overwrites a file on re-upload --
        # a replaced image always gets a new unique filename (see
        # get_available_name() in FileSystemStorage), so a given URL's
        # content never changes. Safe to cache indefinitely: a new upload
        # always has a new URL, so viewers never see a stale image.
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ================= ROOT REDIRECT =================
    location = / {
        return 301 /sauti/;
    }
}
