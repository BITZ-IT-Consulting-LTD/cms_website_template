# Top-level reverse proxy for local development

server {
    listen 80;
    client_max_body_size 30M;
    server_name localhost;

    # Docker's embedded DNS server. Combined with the `set $..._upstream ...`
    # variables below, this makes nginx re-resolve backend/frontend/admin on a
    # short TTL instead of caching whatever IP they had when nginx itself last
    # started. Without this, `docker compose up -d --build` recreating any one
    # of those services (which always changes its container IP) leaves nginx
    # proxying to a dead IP -- "connect() failed (111: Connection refused)",
    # 502s on every request -- until nginx itself is restarted by hand.
    resolver 127.0.0.11 valid=10s;

    # Common proxy settings
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ---------------- API (Django backend) ----------------
    location /api/ {
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;  # No URI = preserves /api/ prefix
        proxy_set_header Host backend;  # Set Host header to backend for Django ALLOWED_HOSTS
    }

    # ---------------- Crawler-facing OG previews for article links (item 10) ----------------
    # WhatsApp/Facebook/X/LinkedIn/Telegram etc. fetch a shared link and read its
    # <meta> tags without running JS, so the client-rendered SPA is invisible to
    # them. For requests whose User-Agent matches a known link-preview crawler
    # ONLY, transparently serve the Django-rendered OG HTML (real per-article
    # title/description/image) instead of the SPA shell, at this same URL.
    # Everyone else keeps hitting the normal Vite app below.
    # Internal target for the crawler rewrite below. `internal` means it
    # cannot be requested from outside, so it is not a second public URL
    # for the same article.
    location ~ ^/__og_preview/(?<og_slug>.+)$ {
        internal;
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream/api/seo/post/$og_slug/;
        proxy_set_header Host backend;
    }

    location ~ ^/blogs/(?<og_slug>[^/]+)/?$ {
        set $frontend_upstream frontend:5173;
        if ($http_user_agent ~* "facebookexternalhit|Facebot|Twitterbot|WhatsApp|LinkedInBot|TelegramBot|Slackbot|Discordbot|SkypeUriPreview|Pinterest|redditbot|Applebot|Googlebot|bingbot|DuckDuckBot") {
            rewrite ^ /__og_preview/$og_slug last;
        }
        proxy_pass http://$frontend_upstream;
    }

    # ---------------- Media Files ----------------
    location /sauti/media/ {
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;  # No URI = preserves /sauti/media/ prefix
        proxy_set_header Host backend;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------------- Admin frontend (Vite) ----------------
    location /admin/ {
        set $admin_upstream admin:5174;
        proxy_pass http://$admin_upstream;
    }

    # ---------------- Legacy Redirects ----------------
    location ~* ^/get-help/(.*)$ {
        return 301 /#$1;
    }

    # ---------------- Public frontend (Vite) ----------------
    location / {
        set $frontend_upstream frontend:5173;
        proxy_pass http://$frontend_upstream;  # No URI = preserves original path
    }
}
