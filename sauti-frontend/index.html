<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Sauti 116 helpline - Support for children, GBV survivors, and migrant workers in Uganda. Call 116 for help."
    />
    <meta
      name="keywords"
      content="child helpline, Uganda, GBV support, migrant workers, child protection"
    />
    <title>Sauti 116 helpline - Get Help Now</title>

    <!--
      Open Graph / Twitter Card meta tags for rich link previews on
      WhatsApp, Facebook, X, etc. These crawlers do NOT execute JS, so the
      values below are static site-wide defaults and are what a crawler
      sees for every URL that ISN'T specifically handled below.

      Per-article previews (item 10): rather than SSR/prerendering the whole
      SPA, article links are served by a small Django view
      (sauti_cms/seo/views.py, GET /api/seo/post/<slug>/) that renders
      crawler-facing HTML with that post's own og:title/description/image.
      nginx routes requests to /blogs/<slug> (dev) or /sauti/blogs/<slug>
      (prod) to that view ONLY when the request's User-Agent matches a known
      link-preview crawler (facebookexternalhit, WhatsApp, Twitterbot,
      LinkedInBot, TelegramBot, ...) — see docker/nginx/dev.conf,
      docker/nginx/prod.conf and docker/nginx/host/sauticms/cms_logic.inc.
      Human visitors keep hitting this SPA shell at the same URL. Resource
      links are not covered by this — see ResourcesPage.vue's share row.
    -->
    <meta property="og:title" content="Sauti 116 helpline - Get Help Now" />
    <meta
      property="og:description"
      content="Sauti 116 helpline - Support for children, GBV survivors, and migrant workers in Uganda. Call 116 for help."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sauti 116" />
    <meta property="og:url" content="https://sauti.mglsd.go.ug/sauti/" />
    <meta property="og:image" content="https://sauti.mglsd.go.ug/logo.png" />
    <meta property="og:image:alt" content="Sauti 116 helpline logo" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sauti 116 helpline - Get Help Now" />
    <meta
      name="twitter:description"
      content="Sauti 116 helpline - Support for children, GBV survivors, and migrant workers in Uganda. Call 116 for help."
    />
    <meta name="twitter:image" content="https://sauti.mglsd.go.ug/logo.png" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
